name: Validate site and API code

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "package.json"
      - "render.yaml"
      - "DEPLOYMENT-FEEDBACK.md"
      - "js/admin.js"
      - "js/analytics-feedback.js"
      - "js/api-config.js"
      - "js/site.js"
      - "js/nav-dropdown.js"
      - "js/seasons.js"
      - "css/responsive.css"
      - "css/seasons.css"
      - "seasons.html"
      - "js/donate.js"
      - "js/donate-config.js"
      - ".github/workflows/validate-node.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Check JavaScript syntax
        run: npm run check
