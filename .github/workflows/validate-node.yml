name: Validate site and API code

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "server.js"
      - "package.json"
      - "render.yaml"
      - "DEPLOYMENT-FEEDBACK.md"
      - "js/**"
      - "css/**"
      - "*.html"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-node.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check weather, scoring, live state, storage and API regressions
        run: npm test
