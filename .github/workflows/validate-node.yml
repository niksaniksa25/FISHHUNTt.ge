name: Validate site and API code

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "js/admin.js"
      - "js/analytics-feedback.js"
      - "js/api-config.js"
      - "js/site.js"
      - "js/donate.js"
      - "js/donate-config.js"
      - ".github/workflows/validate-node.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check js/admin.js
          node --check js/analytics-feedback.js
          node --check js/api-config.js
          node --check js/site.js
          node --check js/donate.js
          node --check js/donate-config.js
