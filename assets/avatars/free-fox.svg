 <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#181818"/><stop offset="1" stop-color="#0b0e0d"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".35"/></filter>
</defs>
<rect width="720" height="720" rx="80" fill="url(#bg)"/>
